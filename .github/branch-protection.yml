# Documented branch-protection policy for m9-core-utils.
# The authoritative configuration is enforced by GitHub; this file is auditable policy.
branches:
  main:
    require_pull_request: true
    required_status_checks:
      - "test (3.10)"
      - "test (3.11)"
      - "test (3.12)"
    enforce_admins: true
    allow_force_pushes: false
    allow_deletions: false
