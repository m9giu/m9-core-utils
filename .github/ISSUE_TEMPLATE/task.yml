name: Task
description: Propose one substantive unit of work
title: "task: "
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable outcomes; one per line.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: How will this be verified?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Contribution rules
      options:
        - label: This is a substantive change, not a counter-inflation edit
          required: true
        - label: No secrets or personal data are included
          required: true
